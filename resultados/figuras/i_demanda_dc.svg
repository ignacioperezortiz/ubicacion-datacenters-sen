  <g id="text_20">
   <text style="font-weight: 600; font-size: 12px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="6.912" y="18.96375" transform="rotate(-0 6.912 18.96375)">Los escenarios van de 331 a 9.839 MW medios de data centers en 2050</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="6.912" y="37.753594" transform="rotate(-0 6.912 37.753594)">Demanda plana de data centers en cada período del modelo (fija + ubicable).</text>
  </g>
  <g id="text_22">
   <text style="font-size: 7.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #898781" transform="translate(6.912 306.847236)">Cada valor rige todo su período (2025-2026, 2027-2029, …, 2050-2054). PROPIO incluye 115 MW de data centers con ubicación fija (dc_fijo.csv).</text>
